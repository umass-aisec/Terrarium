simulation:
  max_iterations: 1
  max_planning_rounds: 1
  max_conversation_steps: 3
  seed: 42
  tags:
    - baseline
  note: "im a note"
environment:
  name: MeetingSchedulingEnvironment
  assignment_filling: false
  # CoLLAB v2 MeetingScheduling (attendance intervals)
  num_meetings: 3
  timeline_length: 12
  min_participants: 2
  max_participants: 4
  soft_meeting_ratio: 0.6
communication_network:
  # Topology used to create blackboards
  # Options: complete | path | star | erdos_renyi
  # erdos_renyi requires `edge_prob` (0..1) and uses `simulation.seed`
  topology: erdos_renyi
  num_agents: 6
  edge_prob: .7
  # consolidate_channels=false => one blackboard per edge
  # consolidate_channels=true => one blackboard per clique (plus leftover edges)
  consolidate_channels: true
llm:
  # Provider: "openai", "foundry", "anthropic", "gemini", "together", "fireworks", or "vllm"
  provider: "anthropic"
  # Optional external MCP servers (discovered as extra tools per client):
  # Experimental: provider-agnostic and can be used with OpenAI/Foundry/Anthropic/Gemini/Together/Fireworks/vLLM.
  # external_mcp_servers:
  #   - name: "filesystem"
  #     url: "http://127.0.0.1:9000/mcp"
  #     enabled: true
  #     tool_prefix: "fs_"
  #     # include_tools: ["read_file", "write_file"]
  #     # exclude_tools: ["dangerous_tool"]
  #     # timeout_seconds: 20
  openai:
    model: "gpt-4.1-mini-2025-04-14"
    params:
      max_tokens: 1024
      temperature: 0.7
      reasoning_effort: "low"
      verbosity: "low"
  foundry:
    model: "<model_or_deployment_name>"
    params:
      max_tokens: 1024
      temperature: 0.7
  anthropic:
    model: "claude-sonnet-4-5"
    params:
      max_tokens: 4000
      temperature: 0.7
      top_p: 0.95
  gemini:
    model: "gemini-2.0-flash-lite"
    params:
      max_tokens: 1024
      temperature: 0.6
      top_p: 0.95
  together:
    model: "zai-org/GLM-4.6"
    params:
      max_tokens: 1024
      temperature: 0.7
  vllm:
    auto_start_server: true
    persistent_server: false  # Keep the vLLM server alive between runs to avoid cold starts
    health_check_path: "/models"
    startup_timeout: 420 # When starting a new server, max time (s) to wait for it to be ready
    params:
      max_tokens: 1024
      temperature: 0.7
    models:
      - checkpoint: "Qwen/Qwen2.5-7B-Instruct"
        host: "127.0.0.1"
        port: 8020
        tensor_parallel_size: 1
        gpu_memory_utilization: 0.9
        max_model_len: 16000
        trust_remote_code: true
        additional_args:
          # Will pick the correct parser per model family (e.g., mistral, qwen, hermes)
          - "--enable-auto-tool-choice"
notes:
- MeetingScheduling baseline configuration (no attacks)
- MeetingScheduling always logs scores for each iteration
- MeetingScheduling environment coordinates attendance intervals across agents
- Agents coordinate via blackboards during planning phase
- Final attendance decisions happen during execution using attend_meeting action
- Meetings have fixed windows on a shared timeline; soft meetings reward overlap
- Strict meetings reward full‑window attendance; overlaps across two meetings are penalized
- Objective: Maximize global reward ratio from CoLLAB v2 scoring
- Simulation stops when all attendance variables are assigned or max iterations reached
