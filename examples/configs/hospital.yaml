simulation:
  max_iterations: 1      # Increased for scheduling dialogues
  max_planning_rounds: 4
  max_conversation_steps: 20
  seed: 42
  output_dir: "outputs/hospital_jobshop"
  tags:
    - hospital_jobshop
  note: "Distributed Job Shop Scheduling: Departments schedule Patient workflows."

environment:
  name: HospitalEnvironment
  # data_path: "data/hospital/jobshop_scenarios.json" # Commented out to trigger internal Synthetic Generator
  
  # New Job Shop parameters
  num_patients: 8         # Number of synthetic patient workflows
  default_capacity: 2     # Lower capacity to force scheduling conflicts
  
  # Legacy parameters (kept for schema compatibility, though agents are auto-generated by the env now)
  num_agents: 8           

communication_network:
  # Topology options: complete | path | star | random
  topology: complete
  num_agents: 8 # Used by network factory for channel initialization
  consolidate_channels: true

llm:
  # Provider: "openai", "anthropic", "gemini", "together", "fireworks", or "vllm"
  # Switched to "openai" (GPT-4o) as scheduling requires high arithmetic precision
  provider: "openai"
  
  openai:
    model: "gpt-4.1-mini-2025-04-14"
    params:
      max_tokens: 1024
      temperature: 0.7
      
  anthropic:
    model: "claude-sonnet-4-5"
    params:
      max_tokens: 4000
      temperature: 0.7
      
  gemini:
    model: "gemini-1.5-pro"
    params:
      max_tokens: 1024
      temperature: 0.7


  together:
    model: moonshotai/Kimi-K2-Instruct-0905
    params:
      max_tokens: 2000
      temperature: 0.7

  vllm:
    auto_start_server: true
    persistent_server: false
    health_check_path: "/models"
    startup_timeout: 420
    params:
      max_tokens: 1024
      temperature: 0.7
    models:
      - checkpoint: "Qwen/Qwen2.5-7B-Instruct"
        host: "127.0.0.1"
        port: 8020
        tensor_parallel_size: 1
        gpu_memory_utilization: 0.9
        max_model_len: 16000
        trust_remote_code: true
        additional_args:
          - "--enable-auto-tool-choice"

notes:
- Hospital Job Shop Scheduling
- Agents (Departments) must schedule multi-step patient workflows.
- Constraints: Precedence (Step A before B) and Capacity.
- Objective: Minimize Flow Time (Discharge - Arrival).
