simulation:
  max_iterations: 3
  max_planning_rounds: 1
  max_conversation_steps: 2
  seed: 42
  output_dir: "outputs/hospital_jobshop"
  tags:
    - hospital_jobshop_freeform
  note: "Distributed Job Shop Scheduling: Departments schedule Patient workflows."

environment:
  name: HospitalEnvironment
  # data_path: "data/hospital/jobshop_scenarios.json" # Commented out to trigger internal Synthetic Generator
  
  # New Job Shop parameters
  num_patients: 8         # Number of synthetic patient workflows
  default_capacity: 2     # Lower capacity to force scheduling conflicts
  
  # Legacy parameters (kept for schema compatibility, though agents are auto-generated by the env now)
  num_agents: 8

  # Native collusion config (optional). When enabled, the listed agents become
  # "adversaries": build_agent_context gives every agent role/coalition_members/
  # secret_blackboard_id, and adversaries additionally see the instructions text
  # (loaded from instructions_file) at the end of their user prompt.
  # collusion:
  #   enabled: true
  #   members: ["General_Hospital_Surgery", "Resource_Provisioner"]   # or {indices: [0, 2]} resolved against env.agent_names
  #   strategy: "covert"          # free-form label, echoed into context/prompts
  #   instructions_file: "examples/configs/hospital_collusion_instructions.txt"  # text rendered to adversaries only
  #                                        # (relative paths resolve against this config file's directory)

  # Optional native prompt wrapper ("module:Class"), e.g. a MisalignmentPrompts-style
  # decorator: wrapper_cls(env, full_config, base_prompts=HospitalPrompts(...)).
  # prompt_wrapper: "my_package.my_prompts:MisalignmentPrompts"


  # Persona shaping (optional, see terrarium/personas): wraps an agent's system
  # prompt with a Big Five persona clause. Presets: "cautious skeptic",
  # "anxious pushover", "confident collaborator", "diplomat", "territorial".
  # Uniform for every agent:
  # persona: "diplomat"
  # Or per-agent (every agent name must be listed, e.g. with num_hospitals: 2):
  # personas:
  #   General_Hospital_Triage: "diplomat"
  #   General_Hospital_Radiology: "cautious skeptic"
  #   General_Hospital_Surgery: "territorial"
  #   General_Hospital_Ward: "confident collaborator"
  #   St_Marys_Center_Triage: "anxious pushover"
  #   St_Marys_Center_Radiology: "diplomat"
  #   St_Marys_Center_Surgery: "cautious skeptic"
  #   St_Marys_Center_Ward: "confident collaborator"
  #   Resource_Provisioner: "diplomat"

communication_network:
  # Topology options: complete | path | star | random
  topology: complete
  num_agents: 8 # Used by network factory for channel initialization
  consolidate_channels: true

llm:
  # Provider: "openai", "foundry", "anthropic", "gemini", "together", "fireworks", or "vllm"
  # Switched to "openai" (GPT-4o) as scheduling requires high arithmetic precision
  provider: "openai"
  # Optional external MCP servers (discovered as extra tools per client):
  # Experimental: provider-agnostic and can be used with OpenAI/Foundry/Anthropic/Gemini/Together/Fireworks/vLLM.
  # external_mcp_servers:
  #   - name: "filesystem"
  #     url: "http://127.0.0.1:9000/mcp"
  #     enabled: true
  #     tool_prefix: "fs_"
  #     # include_tools: ["read_file", "write_file"]
  #     # exclude_tools: ["dangerous_tool"]
  #     # timeout_seconds: 20
  
  openai:
    model: "gpt-4.1-mini-2025-04-14"
    params:
      max_tokens: 1024
      temperature: 0.7
  foundry:
    model: "<model_or_deployment_name>"
    params:
      max_tokens: 1024
      temperature: 0.7
      
  anthropic:
    model: "claude-sonnet-4-5"
    params:
      max_tokens: 4000
      temperature: 0.7
      
  gemini:
    model: "gemini-1.5-pro"
    params:
      max_tokens: 1024
      temperature: 0.7


  together:
    model: moonshotai/Kimi-K2-Instruct-0905
    params:
      max_tokens: 2000
      temperature: 0.7

  vllm:
    auto_start_server: true
    persistent_server: false
    health_check_path: "/models"
    startup_timeout: 420
    params:
      max_tokens: 1024
      temperature: 0.7
    models:
      - checkpoint: "Qwen/Qwen2.5-7B-Instruct"
        host: "127.0.0.1"
        port: 8020
        tensor_parallel_size: 1
        gpu_memory_utilization: 0.9
        max_model_len: 16000
        trust_remote_code: true
        additional_args:
          - "--enable-auto-tool-choice"

notes:
- Hospital Job Shop Scheduling
- Agents (Departments) must schedule multi-step patient workflows.
- Constraints: Precedence (Step A before B) and Capacity.
- Objective: Minimize Flow Time (Discharge - Arrival).
