[project]
name = "terrarium"
version = "0.1.0"
description = "decentralized multi-agent LLM-based framework"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.71.0",
    "fastmcp>=2.12.5",
    "matplotlib==3.10.7",
    "mcp>=1.18.0",
    "networkx>=3.3",
    "numpy>=1.26,<2.3",
    "Pillow>=12.0.0",
    "protobuf>=6.33.0",
    "python-dotenv>=1.1.1",
    "PyYAML>=6.0.3",
    "Requests>=2.32.5",
    "torch>=2.6.0",
    "tqdm>=4.66.4",
    "openai",
    # vLLM is GPU-only; restrict to Linux x86_64 so macOS/ARM skips CUDA deps.
    "vllm==0.12.0; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "pandas"
]

[tool.uv]
# Ensure the lock resolves for both macOS (dev) and Linux x86_64 (GPU servers).
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
