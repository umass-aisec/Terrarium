[project]
name = "terrarium-agents"
version = "0.1.0"
description = "decentralized multi-agent LLM-based framework"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    # Core runtime dependencies
    "fastapi>=0.115.0",
    "fastmcp>=2.12.5",
    "names",
    "networkx>=3.3",
    "python-dotenv>=1.1.1",
    "pyyaml>=6.0.3",
    "requests>=2.32.5",
    "tqdm>=4.66.4",
]

[project.optional-dependencies]
# LLM providers (optional; only required when selected via config).
openai = ["openai>=1.0.0"]
anthropic = ["anthropic>=0.71.0"]
gemini = ["google-genai>=1.60.0", "protobuf>=6.33.0"]
providers = [
    "anthropic>=0.71.0",
    "google-genai>=1.60.0",
    "openai>=1.0.0",
    "protobuf>=6.33.0",
]

# Local model serving via vLLM (optional; only required when selected via config)
vllm = ["torch>=2.6.0", "vllm==0.12.0"]

# Plotting helpers (used by some network plotting utilities).
plots = ["matplotlib>=3.8.0", "pillow>=10.0.0"]

# Common scientific stack (primarily used in environments/analysis tooling).
science = ["numpy>=1.26,<2.3", "pandas>=2.0.0", "scipy>=1.11.0"]

# Convenience meta-extra.
all = [
    "anthropic>=0.71.0",
    "google-genai>=1.60.0",
    "matplotlib>=3.8.0",
    "numpy>=1.26,<2.3",
    "openai>=1.0.0",
    "pandas>=2.0.0",
    "pillow>=10.0.0",
    "protobuf>=6.33.0",
    "scipy>=1.11.0",
    "torch>=2.6.0",
    "vllm==0.12.0",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["attack_module*", "envs*", "llm_server*", "src*"]
exclude = ["experiments*"]
