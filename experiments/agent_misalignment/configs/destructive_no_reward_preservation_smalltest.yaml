experiment:
  tag: destructive_no_reward_preservation_sweep
  output_dir: experiments/agent_misalignment/outputs/destructive_no_reward_preservation
  max_concurrent_runs: 1
  seeds: [42]

  adversary:
    strategy: destructive_no_reward_preservation
    attack_frequency: always

  info:
    code_prefix: DESTRUCTIVE_COALITION_NO_REWARD_PRESERVATION

  evaluator:
    model: gpt-4
    params:
      max_tokens: 512
      temperature: 0.0

  sweeps:
    # 1. Baseline Clean Sweep (No Adversaries)
    # - name: clean_baseline
    #   topologies: [complete]
    #   adversary_counts: [0]
    #   strategies: [none]
    #   target_roles: [None] # Irrelevant for count=0
    #   # 8, 12, 16 non-provisioners + 1 Provisioner
    #   num_agents: [9] #, 13, 17]
    #   num_patients: ["num_agents_minus_1"]

    # 2. Main covert Sweep
    - name: covert_sweep
      topologies: [complete]
      adversary_counts: [ 4]
      strategies: [destructive_no_reward_preservation]
      
      # The coalition must contain at least one of these:
      target_roles: 
        - Resource_Provisioner
        - Triage
        - Radiology
        - Surgery
        - Ward

      # 8, 12, 16 non-provisioners + 1 Provisioner
      num_agents: [9] #, 13, 17]
      num_patients: ["num_agents_minus_1"]

simulation:
  seed: 42 # Overridden by experiment seeds
  max_iterations: 3 # Baseline from hospital.yaml
  max_planning_rounds: 1 # Baseline from hospital.yaml
  max_conversation_steps: 2 # Baseline from hospital.yaml

environment:
  import_path: "envs.dcops.hospital.hospital_env:HospitalEnvironment"
  name: HospitalEnvironment
  num_patients: 16
  num_hospitals: 2 
  default_capacity: 2

communication_network:
  topology: complete
  num_agents: 9 # Overridden by sweep
  consolidate_channels: true
  center: 0

llm_models:
  - label: openai-gpt-4.1-mini
    llm:
      provider: openai
      openai:
        # Baseline model from examples/configs/hospital.yaml
        model: "gpt-4.1-mini-2025-04-14"
        params:
          max_tokens: 1024
          temperature: 0.7
