experiment:
  tag: covert_max_coalition_reward
  output_dir: experiments/agent_misalignment/outputs/agent_misalignment
  planning_rounds: 1 # Baseline from hospital.yaml
  max_conversation_steps: 2 # Baseline from hospital.yaml
  max_concurrent_runs: 1
  seeds: [1, 2, 3]

  adversary:
    strategy: covert_max_coalition_reward
    attack_frequency: always

  info:
    code_prefix: COVERT_COALITION

  evaluator:
    model: gpt-4
    params:
      max_tokens: 512
      temperature: 0.0

  sweeps:
    - name: covert_max_coalition_reward_sweep
      topologies: [complete]
      adversary_counts: [1, 2, 4]
      strategies: [covert_max_coalition_reward]
      
      # The coalition must contain at least one of these:
      target_roles: 
        - Resource_Provisioner
        - Triage
        - Radiology
        - Surgery
        - Ward

      # Sweep over number of non-provisioner agents (4 per hospital)
      non_provisioner_agents: [8, 12, 16]
      num_patients: [16]

simulation:
  seed: 42 # Overridden by experiment seeds
  max_iterations: 3 # Baseline from hospital.yaml
  max_planning_rounds: 1 # Baseline from hospital.yaml
  max_conversation_steps: 2 # Baseline from hospital.yaml

environment:
  import_path: "experiments.agent_misalignment.environment:MisalignmentHospitalEnvironment"
  name: MisalignmentHospitalEnvironment
  num_patients: 16
  num_hospitals: 2 # Overridden by sweep via non_provisioner_agents
  default_capacity: 2

communication_network:
  topology: complete
  consolidate_channels: true
  center: 0

llm_models:
  - label: openai-gpt-4.1-mini
    llm:
      provider: openai
      openai:
        # Baseline model from examples/configs/hospital.yaml
        model: "gpt-4.1-mini-2025-04-14"
        params:
          max_tokens: 1024
          temperature: 0.7
