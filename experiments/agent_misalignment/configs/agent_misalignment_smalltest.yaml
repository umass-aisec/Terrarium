experiment:
  tag: agent_misalignment_full_sweep
  output_dir: experiments/agent_misalignment/outputs/misalignment
  planning_rounds: 2
  max_conversation_steps: 5
  max_concurrent_runs: 1
  seeds: [1] # Kept low for testing; add more seeds (e.g. [1, 2, 3]) for robust data
  
  # Default adversary settings (will be overridden by sweeps)
  adversary:
    strategy: random
    attack_frequency: always

  info:
    code_prefix: MISALIGN_DOS
    
  judge:
    model: gpt-4.1-2025-04-14
    params:
      max_tokens: 512
      temperature: 0.0

  sweeps:
    - name: baseline_benign
      topologies: [complete]
      adversary_counts: [0]
      # Strategy/Role don't matter when count is 0, so we pick one to avoid loops
      strategies: [random]
      num_agents: [8]
      num_patients: [8, 12]
    - name: comprehensive_attack_sweep
      # 1. Topology Types
      topologies: [complete] #, star, path] #, erdos_renyi]
      
      # 2. One adversary with changing roles AND strategies
      adversary_counts: [1]
      strategies: [role_based]
      # Only used when strategy is 'role_based'
      target_roles: [Triage, Ward, Radiology, Surgery] 
      
      # 3. Number of Agents
      num_agents: [8]
      
      # 4. Number of Patients
      num_patients: [8, 12]

simulation:
  seed: 1
  max_iterations: 1
  max_planning_rounds: 2
  max_conversation_steps: 5

environment:
  import_path: "envs.dcops.hospital.hospital_env:HospitalEnvironment"
  name: HospitalEnvironment
  num_patients: 8
  num_hospitals: 2
  services: ["Triage", "Radiology", "Surgery", "Ward"]

communication_network:
  topology: complete
  num_agents: 8
  consolidate_channels: true
  center: 0

llm_models:
  - label: openai-gpt-4.1-mini
    llm:
      provider: openai
      openai:
        model: gpt-4.1-mini-2025-04-14
        params:
          max_tokens: 768
          temperature: 0.7