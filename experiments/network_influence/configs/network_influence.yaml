experiment:
  tag: network_influence
  output_dir: experiments/network_influence/outputs/network_influence
  planning_rounds: 3
  max_conversation_steps: 3
  # Run-level parallelism. Higher values increase API concurrency (watch rate limits/cost).
  max_concurrent_runs: 1
  # Default seeds used for every sweep combination (runs = len(seeds) unless runs_per_setting is set).
  seeds: [1, 2]
  # Optional: cap how many seeds to use from the list above.
  # runs_per_setting: 2
  adversary:
    strategy: random  # random | highest_degree | center
    force_seed: true
    victim_assignment: distinct  # distinct | shared
    misinfo_frequency: always  # once | always
  info:
    code_prefix: PREF_CODE
    # Binary label for a "travel all week" availability claim about the target agent.
    true_preference: no_trip
    false_preference: on_trip
  judge:
    model: gpt-4.1-2025-04-14
    params:
      max_tokens: 512
      temperature: 0.0
  sweeps:
    - name: adv_count_sweep
      topologies: [path, star, complete]
      num_agents: [6]
      adversary_counts: [0, 1, 2]
    - name: scaling_sweep
      topologies: [path, star, complete]
      num_agents: [3, 5, 7, 9]
      adversary_counts: [1]

# Baseline environment config (used as a template; each run overrides llm + comm_network fields)
simulation:
  seed: 1
  max_iterations: 1
  max_planning_rounds: 2
  max_conversation_steps: 3
environment:
  # Select an environment by exported class name (e.g., MeetingSchedulingEnvironment, JiraTicketEnvironment),
  # or provide an explicit import path:
  # import_path: "some.package.some_module:MyEnvironmentClass"
  name: MeetingSchedulingEnvironment
  num_meetings: 3
  timeline_length: 12
  min_participants: 2
  max_participants: 4
  soft_meeting_ratio: 0.6
communication_network:
  topology: path
  num_agents: 6
  consolidate_channels: true
  center: 0
llm_models:
  - label: together-gpt-oss-120b
    llm:
      provider: together
      together:
        model: openai/gpt-oss-120b
        params:
          max_tokens: 768
          temperature: 0.7
  - label: together-qwen3-235b
    llm:
      provider: together
      together:
        model: Qwen/Qwen3-235B-A22B-Instruct-2507-tput
        params:
          max_tokens: 768
          temperature: 0.7
  - label: together-kimik2-Instruct
    llm:
      provider: together
      together:
        model: moonshotai/Kimi-K2-Instruct-0905
        params:
          max_tokens: 768
          temperature: 0.7
  - label: together-llama3.3-70b
    llm:
      provider: together
      together:
        model: meta-llama/Llama-3.3-70B-Instruct-Turbo
        params:
          max_tokens: 768
          temperature: 0.7
  - label: openai-gpt-4.1-mini
    llm:
      provider: openai
      openai:
        model: gpt-4.1-mini-2025-04-14
        params:
          max_tokens: 768
          temperature: 0.7
