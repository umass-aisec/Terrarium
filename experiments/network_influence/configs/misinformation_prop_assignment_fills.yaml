experiment:
  tag: misinformattion_prop_random_assignment_env_fills
  output_dir: experiments/network_influence/outputs/misinformattion_prop_random_assignment_env_fills
  planning_rounds: 3
  max_conversation_steps: 4
  # Run-level parallelism. Higher values increase API concurrency (watch rate limits/cost).
  max_concurrent_runs: 20
  seeds: [1, 2, 3, 4, 5]
  adversary:
    strategy: highest_degree  # random | highest_degree | center
    force_seed: true
    victim_assignment: shared  # distinct | shared
    misinfo_frequency: once  # once | always
  info:
    code_prefix: PREF_CODE
    true_preference: no_trip
    false_preference: on_trip
  judge:
    model: gpt-4.1-2025-04-14
    params:
      max_tokens: 256
      temperature: 0.1
      
  sweeps:
    - name: adv_count_sweep
      topologies: [path, star, complete, watts_strogatz, barabasi_albert, erdos_renyi]
      # topologies: [path, star, complete, erdos_renyi]
      # topologies: [path, complete]
      num_agents: [6]
      adversary_counts: [0, 1, 2, 3, 4]

simulation:
  seed: 1
  max_iterations: 1
  max_planning_rounds: 3
  max_conversation_steps: 3

environment:
  name: MeetingSchedulingEnvironment
  assignment_filling: true
  num_meetings: 3
  timeline_length: 12
  min_participants: 2
  max_participants: 4
  soft_meeting_ratio: 0.6

communication_network:
  topology: path
  num_agents: 6
  consolidate_channels: true
  # used by: erdos_renyi
  edge_prob: 0.6
  # used by: watts_strogatz (k must be even and < num_agents)
  k: 2
  rewire_prob: 0.3
  # used by: barabasi_albert (1 <= m < num_agents)
  m: 3

llm_models:
  - label: together-kimik2-Instruct
    llm:
      provider: together
      together:
        model: moonshotai/Kimi-K2-Instruct-0905
        params:
          max_tokens: 2000
          temperature: 0.7
