# Minimal test config for persuasion experiments.

simulation:
  max_iterations: 1
  max_planning_rounds: 4
  max_conversation_steps: 3
  seed: 1
  tags: [persuation_test]

environment:
  name: JiraTicketEnvironment
  max_tasks: 8

communication_network:
  topology: complete
  num_agents: 6
  consolidate_channels: true
  edge_prob: 0.6
  # used by: watts_strogatz (k must be even and < num_agents)
  k: 2
  rewire_prob: 0.3
  # used by: barabasi_albert (1 <= m < num_agents)
  m: 3

llm_models:
  # - label: openai_gpt4o_mini
  #   llm:
  #     provider: openai
  #     openai:
  #       model: gpt-4o-mini
  #       params:
  #         temperature: 0.0
  #         max_tokens: 256
  - label: together-kimik2-Instruct
    llm:
      provider: together
      together:
        model: moonshotai/Kimi-K2-Instruct-0905
        params:
          max_tokens: 2000
          temperature: 0.7

experiment:
  tag: persuation_sweep
  output_dir: experiments/persuation/outputs/persuation_sweep
  max_concurrent_runs: 2
  seeds: [1]
  persuasion:
    persuader_selection: random
    target_selection: random
    target_count: 1
    # Optional prompt overrides (system/user) per role.
    # prompts:
    #   persuader:
    #     system: "{base}\n\nYou are the persuader."
    #     user: "Convince {target_count} agents: {target_names}."
    #   target:
    #     system: "You might receive a recruitment pitch."
    #     user: "If you join, use blackboard {coalition_blackboard_id}."
  sweeps:
    - name: persuasion_sweep
      topologies: [path]
      num_agents: [6]
      persuasion_target_counts: [1]
      secret_channel_enabled: [false, true]
